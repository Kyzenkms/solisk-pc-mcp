<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- App UI Dark Canvas & Panel Fill -->
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B0D"/>
      <stop offset="50%" stop-color="#0E1A1D"/>
      <stop offset="100%" stop-color="#15272B"/>
    </linearGradient>

    <!-- Teal Soft Surface for Brand Mark Badge -->
    <linearGradient id="tealSoft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64F2D3" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#64F2D3" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Electric Teal Stroke (#64F2D3 / #65D6C1) -->
    <linearGradient id="tealStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64F2D3"/>
      <stop offset="100%" stop-color="#65D6C1"/>
    </linearGradient>

    <!-- Lime Active Status Dot (#D1FF91 / #C1E98B) -->
    <linearGradient id="limeStatus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D1FF91"/>
      <stop offset="100%" stop-color="#C1E98B"/>
    </linearGradient>
  </defs>

  <!-- Base Rounded Container (Matching App UI Canvas) -->
  <rect width="512" height="512" rx="112" fill="url(#panelBg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#315157" stroke-width="4"/>

  <!-- Inner Brand Badge (Matching .brand-mark in topbar) -->
  <rect width="320" height="320" x="96" y="96" rx="64" fill="url(#tealSoft)" stroke="#64F2D3" stroke-opacity="0.4" stroke-width="6"/>

  <!-- Precision Line Stroke Mark (Matching App Icon Aesthetics) -->
  <g transform="translate(0, 0)">

    <!-- Outer Terminal Bracket Left '[' -->
    <path d="M 176 192 L 152 192 C 143.163 192 136 199.163 136 208 V 304 C 136 312.837 143.163 320 152 320 H 176"
          fill="none" stroke="url(#tealStroke)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Outer Terminal Bracket Right ']' -->
    <path d="M 336 192 L 360 192 C 368.837 192 376 199.163 376 208 V 304 C 376 312.837 368.837 320 360 320 H 336"
          fill="none" stroke="url(#tealStroke)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Terminal Command Angle '>' -->
    <path d="M 184 224 L 224 256 L 184 288"
          fill="none" stroke="url(#tealStroke)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Cursor Underscore '_' -->
    <path d="M 244 288 H 280"
          stroke="url(#tealStroke)" stroke-width="20" stroke-linecap="round"/>

    <!-- Signal Connection Arrow (Lime Accent matching .status-dot.on) -->
    <path d="M 288 224 L 328 256 L 288 288"
          fill="none" stroke="url(#limeStatus)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Top Protocol Status LED Dot (.status-dot.on) -->
    <circle cx="344" cy="168" r="12" fill="#D1FF91"/>
    <circle cx="344" cy="168" r="20" fill="none" stroke="#D1FF91" stroke-opacity="0.3" stroke-width="4"/>
  </g>
</svg>
