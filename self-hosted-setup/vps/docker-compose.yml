services:
  relay:
    build:
      context: ../../relay-server
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      PORT: "3000"
      DATA_DIR: /app/data
      PUBLIC_URL: "https://${RELAY_DOMAIN}"
      RELAY_ADMIN_TOKEN: "${RELAY_ADMIN_TOKEN}"
    volumes:
      - relay-data:/app/data
    networks:
      - relay
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/ready', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      RELAY_DOMAIN: "${RELAY_DOMAIN}"
      ACME_EMAIL: "${ACME_EMAIL}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - relay
      - public
    depends_on:
      relay:
        condition: service_healthy

networks:
  relay:
    internal: true
  public:

volumes:
  relay-data:
  caddy-data:
  caddy-config:
