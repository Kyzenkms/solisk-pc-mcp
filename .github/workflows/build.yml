name: Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop-app/package-lock.json

      - run: npm ci

      - name: Build unsigned beta installer
        run: npm run build:unsigned-beta

      - name: Compute checksums
        shell: pwsh
        run: |
          Get-ChildItem "dist\*.exe" | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$h  $($_.Name)" | Tee-Object -FilePath "dist\SHA256SUMS.txt" -Append
          }
          Get-Content "dist\SHA256SUMS.txt"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: desktop-app/dist/PC Control MCP Setup *.exe

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: portable
          path: desktop-app/dist/win-unpacked/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            desktop-app/dist/PC Control MCP Setup *.exe
            desktop-app/dist/SHA256SUMS.txt
